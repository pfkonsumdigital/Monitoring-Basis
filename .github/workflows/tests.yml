name: Tests

# Prüft jeden Push auf main und jeden Pull Request: Basis (npm test, ESLint, npm audit) und Start.exe (go test).
# Releases baut weiterhin nur „Release bauen“ bei einem Tag vX.Y.Z.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Code prüfen (ESLint)
        run: npm run lint
      - name: Bekannte Sicherheitslücken in Abhängigkeiten (nur was ausgeliefert wird)
        run: npm audit --omit=dev --audit-level=moderate
      - name: Start.exe testen
        working-directory: launcher
        run: go test ./...

  # Echte Windows-Verschlüsselung (DPAPI) und Dateirechte (icacls) – geht nur auf Windows.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/windows.test.js
