name: Tests

# Prüft jeden Push auf main und jeden Pull Request: Basis (npm test) und Start.exe (go test).
# Releases baut weiterhin nur „Release bauen“ bei einem Tag vX.Y.Z.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Start.exe testen
        working-directory: launcher
        run: go test ./...
